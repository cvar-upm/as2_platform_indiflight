/**:
  ros__parameters:
    cmd_freq: 100.0  # Hz of platform commands send
    info_freq: 10.0  # Hz of platform info publish
    external_odom: false  # Flag to use external odometry source
    device: "/dev/ttyTHS1"  # Serial port to connect to the Platform
    baudrate: 115200 # Baudrate of the serial port
    pi_protocol:
      enable: false  # Set to true once the second UART is wired and configured on the FC
      device: "/dev/ttyTHS2"  # Dedicated UART for indiflight's pi-protocol telemetry (NOT the MSP port above)
      baudrate: 921600  # Matches indiflight's BAUD_AUTO default for FUNCTION_TELEMETRY_PI
    imu:
      frequency: 0.0  # Frequency of IMU measures publication
      covariance:
        gyro: 0.0  # IMU gyroscope mean noise (set to 0 for not calibrated)
        accel: 0.0  # IMU accelerometer mean noise (set to 0 for not calibrated)
        orientation: 0.0 # IMU orientation mean noise (set to 0 for not calibrated)
    battery_hz: 0.0  # Frequency of battery measures publication
    altitude_hz: 0.0  # Frequency of altitude measures publication (set to 0 to disable publication)
    attitude_hz: 0.0  # Frequency of attitude measures publication (set to 0 to disable publication)
    rc_hz: 0.0  # Frequency of RC measures publication (set to 0 to disable publication)
    motor_hz: 0.0  # Frequency of motor individual throttles measures publication
    alpha_voltage: 0.0  # Filter for battery voltage measurements
    min_cell_voltage: 3.7  # Security voltage level for LiPO cells (V)
    max_cell_voltage: 4.2  # Maximum cell charge (V)
    thrust:
      max : 44.0  # Max thrust to send to platform (N)
      min : 0.15  # Min thrust to send to platform (N)
    roll_rate:
      max : 360.0 # Max roll rate to send to platform (deg/s) # ATTENTION: this is in deg/s
      min : -360.0 # Min roll rate to send to platform (deg/s) # ATTENTION: this is in deg/s
    pitch_rate:
      max : 360.0  # Max pitch rate to send to platform (deg/s) # ATTENTION: this is in deg/s
      min : -360.0  # Min pitch rate to send to platform (deg/s) # ATTENTION: this is in deg/s
    yaw_rate:
      max : 360.0  # Max yaw rate to send to platform (deg/s) # ATTENTION: this is in deg/s
      min : -360.0  # Min yaw rate to send to platform (deg/s) # ATTENTION: this is in deg/s
    use_thrust_map: false # Flag to use lineal approximation (default) or polynomial thrust map 
    polynomial_thrust_map:  # thrust map poly coefficients from fitted surface to benchmark data
      max_throttle: 2000.0
      min_throttle: 1000.0
      # F(x = Thrust, y = Voltage) = a+b*x+c*y+d*x**2+e*x*y+f*y**2
      a: 0.0
      b: 0.0
      c: 0.0
      d: 0.0
      e: 0.0
      f: 0.0
      use_correction_factor: false # Flag to activate estimated thrust correction
      # Gamma(V) = gamma2*V*V + gamma1*V + gamma0
      gamma2: 0.0 # Coefficient for voltage squared
      gamma1: 0.0 # Coefficient for voltage
      gamma0: 0.0 # Constant term

    limit_output: true  # Flag to limit the output of the platform
    limit_roll_percent: 1.0 # Limit of roll command in percent (between 0 and 1)
    limit_pitch_percent: 1.0  # Limit of pitch command in percent (between 0 and 1)
    limit_yaw_percent: 1.0  # Limit of yaw command in percent (between 0 and 1)
    limit_thrust_percent: 0.6  # Limit of thrust command in percent (between 0 and 1)


